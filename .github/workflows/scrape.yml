name: Scrape Mercado Libre
on:
  schedule:
    - cron: "0 11,21 * * *"   # 8:00 y 18:00 ART + espera aleatoria de hasta 4hs (ver abajo) = termina cayendo en algun punto de 8-12hs y 18-22hs ART, centrado en 10:00/20:00
  workflow_dispatch: {}
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 260
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Instalar dependencias
        run: npm install
      - name: Espera aleatoria (para no arrancar siempre a la misma hora)
        if: github.event_name == 'schedule'
        run: |
          WAIT=$((RANDOM % 14400))
          echo "Esperando ${WAIT}s (hasta 4hs) antes de scrapear..."
          sleep "$WAIT"
      - name: Scrapear (vía Firecrawl) y guardar en Redis
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: npm run scrape
